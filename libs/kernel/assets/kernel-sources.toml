# Reviewed kernel source pins for cacheable custom builds.
#
# Every entry is a reviewed, immutable source: an exact kernel version, a
# canonical HTTPS URL on cdn.kernel.org, and the SHA-256 digest of the
# archive. Runtime builds trust this reviewed digest, never a mutable upstream
# version listing.
#
# Update procedure (recorded in docs/SecurityBoundaries.md):
#   1. Download the upstream signed checksums for the release:
#      https://cdn.kernel.org/pub/linux/kernel/v7.x/sha256sums.asc
#   2. Verify the signature against the kernel.org signing key.
#   3. Record the verified digest here as a reviewed source change with the
#      provenance in the commit message.
#
# Provenance: digests read from the upstream signed sha256sums.asc on
# 2026-08-15.
