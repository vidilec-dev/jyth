[package]
name = "jyth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hypervisor   = { workspace = true }
protocol     = { workspace = true }
com          = { workspace = true }
image-core   = { path = "../image-core" }
kernel       = { path = "../kernel" }
rootfs       = { path = "../rootfs" }
vm-model     = { workspace = true }
scheduler    = { workspace = true }
guest-client = { workspace = true }
boot-image   = { workspace = true }
jyth-runtime = { workspace = true }

tracing      = { workspace = true, optional = true }
thiserror    = { workspace = true }
blake3       = "1.8.5"
sha2         = "0.10"
tokio        = { workspace = true }
error-stack  = { workspace = true }
uuid         = { workspace = true }
bytes        = { workspace = true }
bitflags     = "2.13.0"
escargot     = "0.5"
tokio-util   = "0.7.18"
anyhow       = "1"

[features]
tracing = ["dep:tracing", "hypervisor/tracing", "com/tracing", "image-core/tracing", "kernel/tracing", "rootfs/tracing"]

[dev-dependencies]
cpio     = "0.4.1"
tar      = "0.4.46"
tempfile = "3"
